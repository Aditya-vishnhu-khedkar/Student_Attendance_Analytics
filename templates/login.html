<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>


<body class="bg-light">


<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-md-5">


            <div class="card shadow">


                <div class="card-header bg-primary text-white text-center">

                    <h3 class="mb-0">
                        Admin Login
                    </h3>

                </div>


                <div class="card-body">


                    {% if error %}

                    <div class="alert alert-danger">

                        {{ error }}

                    </div>

                    {% endif %}


                    <form action="/login"
                          method="POST">


                        <div class="mb-3">

                            <label class="form-label">
                                Username
                            </label>

                            <input type="text"
                                   name="username"
                                   class="form-control"
                                   placeholder="Enter username"
                                   required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input type="password"
                                   name="password"
                                   class="form-control"
                                   placeholder="Enter password"
                                   required>

                        </div>


                        <button type="submit"
                                class="btn btn-primary w-100">

                            Login

                        </button>


                    </form>


                </div>


            </div>


        </div>

    </div>

</div>


</body>

</html>
