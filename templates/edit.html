<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand">
            Student Attendance Analytics
        </span>
    </div>
</nav>

<div class="container mt-5">

    <div class="card shadow">
        <div class="card-body">

            <h3 class="mb-4">Edit Student</h3>

            <form action="/edit/{{ student.id }}" method="POST">

                <div class="mb-3">
                    <label class="form-label">
                        Student Name
                    </label>

                    <input type="text"
                           name="name"
                           class="form-control"
                           value="{{ student.name }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Present Days
                    </label>

                    <input type="number"
                           name="present"
                           class="form-control"
                           value="{{ student.present }}"
                           min="0"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Total Days
                    </label>

                    <input type="number"
                           name="total"
                           class="form-control"
                           value="{{ student.total }}"
                           min="1"
                           required>
                </div>

                <button type="submit" class="btn btn-success">
                    Update Student
                </button>

                <a href="/" class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>
    </div>

</div>

</body>
</html>
